 line(g,156,161,228,161,C.line,2);arrowHead(g,222,161,0,C.subtle,5);line(g,359,161,429,161,C.line,2);arrowHead(g,424,161,0,C.subtle,5);

 }
 if(q<1.1||(q>=5.55&&q<7.4)){

 }
 // 分布式 barrier 传播与完成的简化示意，不模拟完整两阶段提交协议。
 if(q>=1.1&&q<2.7){const x=lerp(93,488,(q-1.1)/1.6);line(g,x,126,x,196,C.blue,2.8,[4,3]);pill(g,'BARRIER',x-38,107,76,C.blue,C.blueSoft,11.5);}
 const store=[207,210,177,45];
 curve(g,[94,187,94,217,152,232,207,232],m.restoring?C.blue:C.line,1.6,m.restoring?[4,3]:[]);

 if(m.restoring){packet(g,[207,232,152,232,94,217,94,187],(q-4.65)/.9,'',C.blue);}

 statusLine(g,message,m.resumed?'teal':'blue');
}
const DRAWS=[drawParallel,drawCDC,drawTransform,drawRouting,drawSchema,drawCheckpoint];
function drawDynamicPanel(g,i,t){
 let q=phase(t);
 g.save();g.beginPath();g.rect(23,104,PW-46,192);g.clip();
 // 演示循环末尾在终态与初态间平滑衔接；首帧始终包含完整图示。
 if(q<7.5){DRAWS[i](g,q);}else{const blend=smooth((q-7.5)/.5);g.globalAlpha=1-blend;DRAWS[i](g,7.49);g.globalAlpha=blend;DRAWS[i](g,0);}
 g.restore();
}
function drawFocusNotes(g,i,t){
 const x=1344,q=phase(t),copy=CAPTIONS[i];
 pill(g,copy[0],x,299,420,C.blue,C.blueSoft,15);
 const lines=wrap(copy[1],22);lines.forEach((s,j)=>txt(g,s,x,391+j*45,35,C.ink,600,'left',440));
 const lines2=wrap(copy[2],36);lines2.forEach((s,j)=>txt(g,s,x,554+j*31,22,C.muted,450,'left',446));
 txt(g,'INDEPENDENT MECHANISM',x,773,14,C.blue,650);
 txt(g,`${String(i+1).padStart(2,'0')} / 06`,x,833,41,C.ink,500);
 line(g,x,860,x+420,860,C.line,4);line(g,x,860,x+420*(q/8),860,C.teal,4);
}
function wrap(s,n){const out=[];let l='';for(const w of s.split(' ')){if((l+' '+w).trim().length>n&&l){out.push(l);l=w;}else l+=(l?' ':'')+w;}if(l)out.push(l);return out;}
function renderAt(t){
 if(!Number.isFinite(t))throw new TypeError('time must be finite');
 state.time=((t%DURATION)+DURATION)%DURATION;
 ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(staticBackground(state.focus),0,0);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
 if(state.focus<0){
  const ai=activeIndex(state.time),local=state.time%4;
  for(let i=0;i<6;i++){ctx.save();ctx.translate(...CARD_POS[i]);drawDynamicPanel(ctx,i,state.time);
   if(i===ai){const a=.48+.42*Math.sin(Math.PI*local/4);ctx.globalAlpha=a;rr(ctx,0,0,PW,PH,18,null,C.teal,2);ctx.globalAlpha=1;rr(ctx,26,PH-1,532*clamp(local/4),3,1.5,C.teal);}
   ctx.restore();}

 }else{ctx.save();ctx.translate(75,269);ctx.scale(2.03,2.03);drawDynamicPanel(ctx,state.focus,state.time);ctx.restore();drawFocusNotes(ctx,state.focus,state.time);}
 const progress=document.getElementById('timeline');if(progress&&document.activeElement!==progress)progress.value=state.time;
 document.getElementById('time').textContent=`${state.time.toFixed(1).padStart(4,'0')} / ${DURATION}s`;
 return state.time;
}
function setResolution(w,h){
 if(!Number.isInteger(w)||!Number.isInteger(h)||w<320||w>7680||h<180||h>4320)throw new RangeError('invalid resolution');
 if(Math.abs(w/h-W/H)>.005)throw new RangeError('16:9 resolution required');
 canvas.width=w;canvas.height=h;staticKey='';renderAt(state.time);
}
function setFocus(i){if(!Number.isInteger(i)||i< -1||i>5)throw new RangeError('invalid focus');state.focus=i;staticKey='';document.getElementById('back').disabled=i<0;renderAt(state.time);}
function tick(now){if(state.playing&&state.last){state.time+=(now-state.last)/1000*state.speed;}state.last=now;renderAt(state.time);state.raf=requestAnimationFrame(tick);}
function playPause(){state.playing=!state.playing;document.getElementById('play').textContent=state.playing?UI.pause:UI.play;}
function updateResolution(){if(IS_EXPORT)return;const r=canvas.getBoundingClientRect();const width=Math.max(1280,Math.min(3840,Math.round(r.width*devicePixelRatio/16)*16));setResolution(width,width*9/16);}
function getModels(t){const q=phase(t);return {cdc:cdcModel(q),transform:transformModel(q),schema:schemaModel(q),checkpoint:checkpointModel(q),splits:splitRecords};}
window.SeaTunnelMotion={renderAt,setResolution,setFocus,getModels,state,telemetry,duration:DURATION};
window.addEventListener('error',e=>telemetry.errors.push(e.message));
document.getElementById('play').onclick=playPause;
document.getElementById('restart').onclick=()=>renderAt(0);
document.getElementById('back').onclick=()=>setFocus(-1);
document.getElementById('speed').onchange=e=>{state.speed=Number(e.target.value);};
document.getElementById('timeline').oninput=e=>{renderAt(Number(e.target.value));};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('player').requestFullscreen();}catch(e){document.getElementById('hint').textContent=UI.fullscreenUnavailable;}};
canvas.onclick=e=>{if(state.focus>=0){setFocus(-1);return;}const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const i=CARD_POS.findIndex(p=>x>=p[0]&&x<=p[0]+PW&&y>=p[1]&&y<=p[1]+PH);if(i>=0)setFocus(i);};
window.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();playPause();}if(e.code==='Escape')setFocus(-1);if(e.key==='r'||e.key==='R')renderAt(0);if(/^[1-6]$/.test(e.key))setFocus(Number(e.key)-1);});
window.addEventListener('resize',updateResolution);
Promise.all([logo.decode(),document.fonts.ready]).then(()=>{staticKey='';setResolution(1920,1080);updateResolution();telemetry.ready=true;document.getElementById('play').textContent=state.playing?UI.pause:UI.play;renderAt(0);if(!IS_EXPORT)state.raf=requestAnimationFrame(tick);}).catch(e=>{telemetry.errors.push(e.message);document.getElementById('hint').textContent=UI.assetLoadFailed+e.message;});
